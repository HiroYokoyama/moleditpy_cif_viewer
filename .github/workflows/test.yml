name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      moleditpy_ref:
        description: 'MoleditPy branch, tag, or full commit SHA (blank uses repository default)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  MOLEDITPY_REF: ${{ inputs.moleditpy_ref || vars.MOLEDITPY_REF || 'main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-qt pytest-cov pytest-mock pytest-timeout
        pip install ase numpy "PySide6-Essentials<6.12" pyvista rdkit
        # Optional test dependencies
        pip install pymatgen

    - name: Install Linux GUI libraries
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0

    - name: Clone main MoleditPy application
      shell: bash
      run: |
        git init "../python_molecular_editor"
        git -C "../python_molecular_editor" remote add origin https://github.com/HiroYokoyama/python_molecular_editor.git
        git -C "../python_molecular_editor" fetch --depth 1 origin "$MOLEDITPY_REF"
        git -C "../python_molecular_editor" checkout --detach FETCH_HEAD
        git -C "../python_molecular_editor" log -1 --format="%H %s"

    - name: Run test suite
      shell: bash
      run: |
        python test_all.py --cov=cif_viewer --cov-report=xml
